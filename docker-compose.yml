services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app/backend
    volumes:
      # 演示产生的数据保存在本地，已通过 .gitignore 排除。
      - ./backend:/app/backend
    env_file:
      - ./backend/.env
    environment:
      TZ: Asia/Shanghai
    ports:
      # 开发登录允许选择角色，因此演示服务仅绑定本机。
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
