# Agently 4 模型接入配置 — AI 试题生成系统
#
# 依据 Agently-Skills 的 model-setup 指导：
#   - Provider 配置外置到 settings 文件，不写在 Python 字面量里
#   - 密钥用 ${ENV.xxx} 占位符，不落库、不入 Git
#   - Provider 设置放在活跃插件读取的命名空间下（plugins.ModelRequester.OpenAICompatible.*）
#
# [注意] Agently 4.1.3.8 限制：${ENV.xxx} 占位符仅对 api_key 生效
#    （见 agently/utils/ModelPool.py::_resolve_env）。
#    base_url / model 等非敏感值直接写在文件中；如需按环境切换端点，
#    由 app/ai/agently_setup.py 以「host-owned override」方式从环境变量覆盖。
#
# 模型别名经 model_pool → model_profiles 解析；
# 请求时通过 agent.create_request(model_key="<别名>") 或 agent.activate_model("<别名>") 选择。

model_pool:
  # M2 出题 / 质量校验（对话模型）
  deepseek-v4: deepseek_profile
  # 知识库条款向量化（嵌入模型）
  dashscope-embed: dashscope_embed_profile

model_profiles:
  deepseek_profile:
    provider: OpenAICompatible
    model: deepseek-chat
    base_url: https://api.deepseek.com/v1
    api_key: ${ENV.DEEPSEEK_API_KEY}
    model_type: chat

  dashscope_embed_profile:
    provider: OpenAICompatible
    model: text-embedding-v4
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key: ${ENV.DASHSCOPE_API_KEY}
    model_type: embeddings

plugins:
  ModelRequester:
    activate: OpenAICompatible
    OpenAICompatible:
      # Agently 要求 timeout 为 connect/read/write/pool 四段字典，传整数会触发 httpx 构造错误
      timeout:
        connect: 30.0
        read: 180.0
        write: 30.0
        pool: 30.0
      request_retry:
        max_attempts: 2
        after_output: true

prompt:
  # 出题与校验均为结构化输出，默认 json 载体
  default_output_format: json

runtime:
  # 关闭模型调用日志噪音，仅保留告警
  show_model_logs: "off"
  httpx_log_level: WARNING
  raise_error: true